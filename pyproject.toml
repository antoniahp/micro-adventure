[project]
name = "micro-adventure"
version = "0.1.0"
description = "MicroAdventures: short walking challenges generated by an open model"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.2.7,<5.3",
    "django-mongodb-backend>=5.2.4,<5.3",
    "django-ninja>=1.6.3,<2.0",
    "django-ninja-jwt>=5.4,<6.0",
    "gunicorn>=23.0.0,<24.0",
    "requests>=2.32.0,<3.0",
    "sentry-sdk[django]>=2.40.0,<3.0",
    "whitenoise (>=6.12.0,<7.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1,<10.0"
pytest-django = ">=4.14,<5.0"
pytest-env = ">=1.7,<2.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
env = ["DJANGO_SECRET_KEY=test-secret-key"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
