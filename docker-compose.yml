services:
  mongo:
    image: mongo:7
    container_name: micro_adventure_mongo
    ports:
      - "27017:27017"
    volumes:
      - micro_adventure_mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: micro_adventure_backend
    # Applies pending migrations on every start, then runs the server.
    command: sh -c "python src/manage.py migrate && python src/manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    # Personal settings and secrets (Sentry, ElevenLabs, model, timeout) live in local.env.
    # It must exist: run "make setup" the first time (it copies sample.env). Only what never changes stays here.
    env_file:
      - local.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: micro_adventure
      # Ollama runs on the host machine, outside Docker.
      OLLAMA_URL: http://host.docker.internal:11434
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo
    volumes:
      - ./src:/usr/src/app/src
      - ./tests:/usr/src/app/tests

volumes:
  micro_adventure_mongo_data:
