services:
  mongo:
    image: mongo:7
    container_name: micro_adventure_mongo
    ports:
      - "27017:27017"
    volumes:
      - micro_adventure_mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: micro_adventure_backend
    # Applies pending migrations on every start, then runs the server.
    command: sh -c "python src/manage.py migrate && python src/manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DEBUG: true
      DJANGO_SECRET_KEY: secret-key
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: micro_adventure
      # Ollama runs on the host machine, outside Docker.
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma3:latest
      PHOTO_VERIFIER: trusting
      # Optional: lets people answer with a voice note. Set it in your shell or in a .env file.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo
    volumes:
      - ./src:/usr/src/app/src
      - ./tests:/usr/src/app/tests

volumes:
  micro_adventure_mongo_data:
